# The READ-ONLY recorder and monitor app (carry-drill). Not an order executor: see the
# "Operating topology" block in RUNBOOKS.md. (Historically it was the unattended TESTNET
# runner, a separate app from carry-book; that role is retired.)
# Its default command is READ-ONLY (tools/runner_monitor.py: reachability, safety
# preconditions, venue state, entry economics; it cannot place an order). The
# order-capable conformance run is a separate command that is NOT to be invoked here.
# Each cycle also records one PUBLIC observation in the post-gate forward shadow
# book at /data/shadow/post_gate_v1.db once that book has been created by hand
# (carry_shadow.py forward-init); the monitor never creates it.
# Any change to this file is an owner-approved deploy (`fly deploy -c fly.drill.toml --ha=false`,
# never `fly launch`, which rewrites config). tests/test_drill_image.py pins these properties.
#
#   one machine, one volume     two runners would be two hedges
#   no [http_service]           nothing to serve
#   kill_timeout 300s           the SIGTERM path unwinds the drill and runs the
#                               reduce-only close; it needs ~4 minutes
#   no secrets in this file     credentials are Fly secrets (names only here); generic BYBIT_API_* are not Testnet credentials

app = "carry-drill"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = "300s"

[build]
dockerfile = "Dockerfile.drill"

[deploy]
strategy = "immediate"

[[restart]]
policy = "on-failure"
retries = 10

[env]
USE_TESTNET = "1"
PAPER_TRADING = "1"          # Round 19: the app default is read-only; the orchestrator forces PAPER_TRADING=0 only inside the order-capable child it starts
BYBIT_VENUE = "testnet"
# "observe" LETS ENTRIES PROCEED while recording what the entry net-benefit
# gate would have refused; it is not read-only and not a safety setting. Today
# it is also INERT here: the drill builds its own engine (tools/drill.py) and
# never attaches that gate, and the read-only monitor does not read it. It is
# declared so that this app can never silently pick up "enforce" if the gate
# is ever attached to it. The drill's only protections are the testnet-only
# checks (session_refusal) and its $100 cap.
CARRY_ENTRY_BENEFIT_MODE = "observe"

[[mounts]]
source = "drill_runs"
destination = "/data"

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
cpus = 1
