[pytest]
markers =
    real_entry_authority: opt out of conftest's permissive entry authority so the test sees the PRODUCTION entry authority (a bare client refuses to open anything).
    real_single_writer: opt out of conftest's per-test satisfied single-writer guard for the armed drill, so the test exercises the real lock + lease guard
    real_entry_ledger: opt out of conftest's per-test temp entry ledger for the drill, so the test exercises the
        drill's real claim_entry_slot (no ledger named = refuse). Everything else gets a fresh ledger per test.
    data_freshness: asserts against the wall clock or the live corpus's own
        growth (real "today", a pinned row count, a frozen window's coverage).
        These are SUPPOSED to go red as real time passes without a corpus
        refresh or a re-pin — that is the signal they exist to give, not a
        code regression. Run `pytest -m "not data_freshness"` for the
        code-correctness signal alone: every test NOT making a claim about
        how fresh the data is right now.
