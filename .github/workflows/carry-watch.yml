# EXTERNAL WATCHER for the read-only runner on Fly (app carry-drill).
#
# WHY: the runner pages Slack itself, but a dead machine cannot report its own
# death. This job runs on GitHub's machines, reads the runner's monitor history
# over `fly ssh`, and runs the same alert rules (tools/runner_alerts.py). A
# machine that is down or silent gives no history, which is itself an alert. A failed READ (expired
# token, unreachable machine, timeout) is reported as that, with a classified cause, never as "no_data".
#
# WHAT IT CANNOT DO: collect market data (Bybit's CloudFront blocks GitHub-
# hosted runners, see carry-drill-testnet.yml, and the real-market evidence is
# one hash-chained file on the Fly volume), place an order, or change the app.
# It only reads one file. No venue key is ever present; LIVE_TRADING_ACK is
# never set.
#
# OFF BY DEFAULT: runs only when the repository VARIABLE CARRY_WATCH_ENABLED is
# "true", from main, in this repository. Two repository SECRETS are needed:
#   FLY_API_TOKEN     fly tokens create deploy -a carry-drill -x 720h
#                     (expires in 30 days; renew it, a dead token alerts too)
#   SLACK_WEBHOOK_URL the same incoming webhook the runner uses
# A red run means there is something to look at: the job fails when an alert
# fires, and the alert is posted to Slack.
name: carry-watch

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carry-watch
  cancel-in-progress: false

jobs:
  watch:
    name: external watcher (read-only)
    if: ${{ github.repository == 'iceccarelli/ai-agent-control' && github.ref == 'refs/heads/main' && vars.CARRY_WATCH_ENABLED == 'true' }}
    # Round 19: a repository-level secret is delivered to a workflow run from ANY branch (workflow_dispatch from a pushed branch whose copy of this file drops the `if:` above), an environment
    # secret with a main-only deployment-branch policy is not (carry-drill-testnet.yml does the same). OWNER: create the environment `fly-watch` (Settings > Environments, deployment branches: main only),
    # move the secrets below into it, then delete the repository-level copies. Naming the environment here changes nothing until then (repository secrets still resolve).
    environment: fly-watch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # actions/setup-python v7.1.0
        with:
          python-version: "3.12"
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # superfly/flyctl-actions 1.6
      # Each secret is set on the ONE step that uses it, never at job level, so
      # the setup-flyctl action above (pinned to a commit) never sees either.
      - name: read the runner history (read-only)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          # One read, tried twice: a single transient `fly ssh` failure should not
          # page "no_data". A persistent failure still ends with an empty history,
          # which the alert rules below report. The cause is printed, never hidden.
          : > read_failure.txt
          ok=0
          for attempt in 1 2; do
            if flyctl ssh console -a carry-drill -C "cat /data/monitor/monitor.jsonl" > history.jsonl 2> fly.err; then
              ok=1
              break
            fi
            echo "history unreadable (attempt $attempt of 2)"
            tail -n 20 fly.err
            : > history.jsonl
            if [ "$attempt" = 1 ]; then sleep 30; fi
          done
          if [ "$ok" = 0 ]; then
            # A failed READ is not "no data": classify it into the closed vocabulary runner_alerts knows (bot/tools/fly_read_failure.py: code a test executes on canned stderr; it used to be a grep chain
            # here whose bare `token` / `401|403` matched inside unrelated text). Only the CLASS leaves this step (error text can carry a token fragment and goes to the job log above, never to Slack).
            python bot/tools/fly_read_failure.py fly.err > read_failure.txt
            echo "history READ FAILED, class: $(cat read_failure.txt)"
          fi
          wc -c < history.jsonl
      - name: run the alert rules
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -s read_failure.txt ]; then
            python bot/tools/runner_alerts.py history.jsonl --read-failure "$(cat read_failure.txt)"
          else
            python bot/tools/runner_alerts.py history.jsonl
          fi
