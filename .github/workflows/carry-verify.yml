# Targeted correctness gate for the carry system.
#
# WHAT THIS IS: a lean, deterministic check that runs on every pull request and
# every push to main. It exercises the carry funding/fee/report/broker/preflight/
# probe/live-gate/hold-audit tests, the production image's import closure (a
# module main.py imports but the Dockerfile does not copy crashes the container,
# which PR #72 shipped), the lifecycle funding-reconciliation,
# out-of-sample audit and operator-verdict tests, the Fly build-context check and a
# checkout-safe whitespace check.
#
# WHAT THIS IS NOT: the repository's full suite. The full suite carries a known
# baseline of 69 failures (documentation, corpus and date-relative fixtures) plus
# 3 files that fail to import on missing modules. Those are NOT run or hidden
# here and are NOT claimed fixed; they are a separate, pre-existing matter. This
# job is green only when the carry correctness tests are green.
#
# THE PRODUCTION IMAGE (job `production-image`): the unit tests above run Python
# in the checkout, which has every module. They cannot see a module that
# main.py imports but the Dockerfile does not copy - PR #72 shipped exactly
# that, and only the static closure test noticed. This job builds the REAL image
# (bot/Dockerfile, context ./bot) on every run and imports the application
# inside THAT image, offline, read-only and unprivileged. It never starts the
# application, never publishes the image, and holds no credential.
#
# NO CREDENTIALS, NO NETWORK TRADING: no secret is read, no Bybit endpoint is
# contacted, and nothing here can place an order. Tests use offline fakes.
name: carry-verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: carry-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  carry-correctness:
    name: carry correctness (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what the production Dockerfile runs; 3.12 is what
        # bot/constraints.txt was last pinned against.
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
        with:
          # Two commits: for a pull request the checked-out commit is the merge
          # of the PR into its base, so HEAD^1 is the base tip.
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Whitespace check on the change (checkout-safe)
        working-directory: .
        run: |
          # Compares the change itself, never the working tree, so a clean
          # checkout cannot make this pass vacuously.
          git rev-parse --verify HEAD^1
          git diff --check HEAD^1 HEAD

      - name: Carry correctness tests
        run: >
          python -m pytest -q -p no:cacheprovider
          tests/test_carry_funding_truth.py
          tests/test_carry_fee_truth.py
          tests/test_carry_report.py
          tests/test_carry_broker.py
          tests/test_carry_preflight.py
          tests/test_carry_preflight_economics.py
          tests/test_fee_payload_probe.py
          tests/test_carry_live_gates.py
          tests/test_carry_fail_closed.py
          tests/test_carry_hold_audit.py
          tests/test_funding_reconciliation.py
          tests/test_carry_oos_audit.py
          tests/test_carry_replay.py
          tests/test_operator_verdicts.py
          tests/test_dockerfile.py
          tests/test_image_ships_the_tools.py
          tests/test_ci_workflow.py

      - name: Fly build context
        run: python tools/fly_stack.py --check

      - name: Scope of this gate
        if: always()
        run: |
          echo "### carry-verify (python ${{ matrix.python }})" >> "$GITHUB_STEP_SUMMARY"
          echo "Targeted carry correctness gate only. The repository's full suite has a known baseline of 69 failures (documentation, corpus and date-relative fixtures) and 3 import errors; it is deliberately not run or claimed fixed here." >> "$GITHUB_STEP_SUMMARY"

  production-image:
    name: production image builds and imports offline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # One tag, built below and run below: the smoke can only ever execute the
      # image THIS run just built from THIS commit.
      IMAGE: ai-agent-control-carry-smoke:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the production image (bot/Dockerfile, context ./bot)
        run: docker build --pull --tag "$IMAGE" ./bot

      - name: Import the application inside the image (offline, no startup)
        run: |
          # --entrypoint python3 REPLACES the image's `python3 main.py`: nothing
          # here can start the trading loop. No network, a read-only root, a
          # throwaway state volume, no capabilities, and the image's own
          # unprivileged user. `import main` alone does not prove the closure
          # (main imports some modules lazily), so funding_reconcile is named.
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --tmpfs /app/state:rw,noexec,nosuid,size=16m \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit 64 \
            -e USE_TESTNET=1 \
            -e PAPER_TRADING=1 \
            -e LIVE_TRADING_ACK= \
            --entrypoint python3 \
            "$IMAGE" \
            -c 'import main; import funding_reconcile; print("production imports OK")'

      - name: Import every shipped module and confirm the image is unprivileged
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --tmpfs /app/state:rw,noexec,nosuid,size=16m \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit 64 \
            -e USE_TESTNET=1 \
            -e PAPER_TRADING=1 \
            -e LIVE_TRADING_ACK= \
            --entrypoint python3 \
            "$IMAGE" \
            -c 'import importlib, os, pathlib; assert os.getuid() != 0, "image runs as root"; names = sorted(p.stem for p in pathlib.Path("/app").glob("*.py")); [importlib.import_module(n) for n in names]; print("imported", len(names), "shipped modules as uid", os.getuid())'

      - name: Scope of this job
        if: always()
        run: |
          echo "### production-image" >> "$GITHUB_STEP_SUMMARY"
          echo "Built bot/Dockerfile from this commit and imported the application inside that image: offline, read-only, unprivileged. The application was not started and the image was not published. This proves the shipped modules import; it says nothing about venue behaviour or profitability." >> "$GITHUB_STEP_SUMMARY"
