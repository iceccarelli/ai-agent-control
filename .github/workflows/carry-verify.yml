# Targeted correctness gate for the carry system.
#
# WHAT THIS IS: a lean, deterministic check that runs on every pull request and
# every push to main. It exercises the carry funding/fee/report/broker/preflight/
# probe/live-gate/hold-audit tests, the production image's import closure (a
# module main.py imports but the Dockerfile does not copy crashes the container,
# which PR #72 shipped), the lifecycle funding-reconciliation,
# out-of-sample audit and operator-verdict tests, the Fly build-context check and a
# checkout-safe whitespace check.
#
# WHAT THIS IS NOT: the repository's full suite. The full suite carries a known
# baseline of 61 failures (documentation, corpus and date-relative fixtures). The 3 files that failed to import on deleted
# modules were removed together with the tools they tested. Those are NOT run or hidden
# here and are NOT claimed fixed; they are a separate, pre-existing matter. This
# job is green only when the carry correctness tests are green.
#
# THE PRODUCTION IMAGE (job `production-image`): the unit tests above run Python
# in the checkout, which has every module. They cannot see a module that
# main.py imports but the Dockerfile does not copy - PR #72 shipped exactly
# that, and only the static closure test noticed. This job builds the REAL image
# (bot/Dockerfile, context ./bot) on every run and imports the application
# inside THAT image, offline, read-only and unprivileged. It never starts the
# application, never publishes the image, and holds no credential.
#
# NO CREDENTIALS, NO NETWORK TRADING: no secret is read, no Bybit endpoint is
# contacted, and nothing here can place an order. Tests use offline fakes.
name: carry-verify

on:
  pull_request:
  push:
    branches: [main, "fix/**"]

permissions:
  contents: read

concurrency:
  group: carry-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  carry-correctness:
    name: carry correctness (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what the production Dockerfile runs; 3.12 is what
        # bot/constraints.txt was last pinned against.
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
        with:
          # Two commits: for a pull request the checked-out commit is the merge
          # of the PR into its base, so HEAD^1 is the base tip.
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Whitespace check on the change (checkout-safe)
        working-directory: .
        run: |
          # Compares the change itself, never the working tree, so a clean
          # checkout cannot make this pass vacuously.
          git rev-parse --verify HEAD^1
          git diff --check HEAD^1 HEAD

      - name: Carry correctness tests
        run: >
          python -m pytest -q -p no:cacheprovider
          tests/test_provisional_exit_reconciliation.py
          tests/test_directional_funding.py
          tests/test_unpriced_exit_visibility.py
          tests/test_funding_sign_lock.py
          tests/test_carry_hold_session.py
          tests/test_simulator_fill_contract.py
          tests/test_funding_window.py
          tests/test_carry_latency.py
          tests/test_carry_cost_inputs.py
          tests/test_carry_cost_reality.py
          tests/test_venue_isolation.py
          tests/test_drill_evidence.py
          tests/test_evidence_reconcile.py
          tests/test_evidence_reconcile_trades.py
          tests/test_exit_execution_ids.py
          tests/test_private_ws_consumer.py
          tests/test_conformance_evidence_end_to_end.py
          tests/test_venue_evidence.py
          tests/test_linear_simulator.py
          tests/test_backtest.py
          tests/test_bybit_connection.py
          tests/test_cancel_books_the_increment.py
          tests/test_carry_core.py
          tests/test_carry_costs.py
          tests/test_carry_risk.py
          tests/test_config.py
          tests/test_directional_close_unconfirmed.py
          tests/test_fee_truthfulness.py
          tests/test_kill_switch_drill.py
          tests/test_ledger.py
          tests/test_live_promotion_check.py
          tests/test_maker_entry_no_double_order.py
          tests/test_micro_live_preflight.py
          tests/test_naked_position_handling.py
          tests/test_negative_quantity_gate.py
          tests/test_orchestrator.py
          tests/test_orchestrator_process_restart.py
          tests/test_position_sizing.py
          tests/test_reconcile_orphans_and_duplicates.py
          tests/test_spot_cost_basis.py
          tests/test_testnet_conformance_run.py
          tests/test_position_lifecycles.py
          tests/test_observe_exits.py
          tests/test_lifecycle_integration.py
          tests/test_process_restart_recovery.py
          tests/test_risk_management.py
          tests/test_carry_funding_truth.py
          tests/test_carry_funding_history_gap.py
          tests/test_carry_symbol_authority.py
          tests/test_carry_venue_direction_integration.py
          tests/test_carry_entry_allowance_survives_restart.py
          tests/test_carry_funding_prints.py
          tests/test_carry_fee_truth.py
          tests/test_carry_report.py
          tests/test_carry_broker.py
          tests/test_carry_preflight.py
          tests/test_carry_preflight_economics.py
          tests/test_fee_payload_probe.py
          tests/test_carry_live_gates.py
          tests/test_carry_fail_closed.py
          tests/test_carry_hold_audit.py
          tests/test_funding_reconciliation.py
          tests/test_carry_oos_audit.py
          tests/test_carry_replay.py
          tests/test_carry_replay_liquidation.py
          tests/test_carry_risk_evidence.py
          tests/test_operator_verdicts.py
          tests/test_dockerfile.py
          tests/test_image_ships_the_tools.py
          tests/test_ci_workflow.py
          tests/test_carry_lifecycle_e2e.py
          tests/test_carry_ambiguous_outcomes.py
          tests/test_carry_tick_safety.py
          tests/test_carry_unusable_view_still_checks_the_venue.py
          tests/test_unwind_completeness.py
          tests/test_carry_cold_start.py
          tests/test_carry_malformed_fill.py
          tests/test_carry_booking_failure_after_fill.py
          tests/test_carry_rebalance_cost_basis.py
          tests/test_carry_overlay.py
          tests/test_carry_cold_start_spot_fee.py
          tests/test_carry_acquire_unwind_net_of_fee.py
          tests/test_carry_engine.py
          tests/test_carry_wiring.py
          tests/test_carry_maker.py
          tests/test_carry_maker_cancel_still_resting.py
          tests/test_carry_order_status_fail_closed.py
          tests/test_carry_order_readback_history.py
          tests/test_carry_late_landing_order.py
          tests/test_carry_hedge_mode_refusal.py
          tests/test_carry_hedge_mode_refusal_wiring.py
          tests/test_carry_venue_clock_wiring.py
          tests/test_carry_unstated_numbers.py
          tests/test_carry_restart_cost_basis.py
          tests/test_carry_journal_persists_with_position.py
          tests/test_carry_wiring_authority.py
          tests/test_drill.py
          tests/test_testnet_session.py
          tests/test_carry_shadow.py
          tests/test_rewire_machine_b.py
          tests/test_control_plane_boundary.py
          tests/test_operator_tools.py
          tests/test_concurrency_and_dataflow.py

      - name: Fly build context
        run: python tools/fly_stack.py --check

      - name: Scope of this gate
        if: always()
        run: |
          echo "### carry-verify (python ${{ matrix.python }})" >> "$GITHUB_STEP_SUMMARY"
          echo "Targeted carry correctness gate only. The repository's full suite has a known baseline of 61 failures (deleted documentation, date-relative corpus fixtures); it is deliberately not run or claimed fixed here." >> "$GITHUB_STEP_SUMMARY"

  production-image:
    name: production image builds and imports offline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # One tag, built below and run below: the smoke can only ever execute the
      # image THIS run just built from THIS commit.
      IMAGE: ai-agent-control-carry-smoke:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the production image (bot/Dockerfile, context ./bot)
        run: docker build --pull --tag "$IMAGE" ./bot

      - name: Import the application inside the image (offline, no startup)
        run: |
          # --entrypoint python3 REPLACES the image's `python3 main.py`: nothing
          # here can start the trading loop. No network, a read-only root, a
          # throwaway state volume, no capabilities, and the image's own
          # unprivileged user. `import main` alone does not prove the closure
          # (main imports some modules lazily), so funding_reconcile is named.
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --tmpfs /app/state:rw,noexec,nosuid,size=16m \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit 64 \
            -e USE_TESTNET=1 \
            -e PAPER_TRADING=1 \
            -e LIVE_TRADING_ACK= \
            --entrypoint python3 \
            "$IMAGE" \
            -c 'import main; import funding_reconcile; print("production imports OK")'

      - name: Import every shipped module and confirm the image is unprivileged
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --tmpfs /app/state:rw,noexec,nosuid,size=16m \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit 64 \
            -e USE_TESTNET=1 \
            -e PAPER_TRADING=1 \
            -e LIVE_TRADING_ACK= \
            --entrypoint python3 \
            "$IMAGE" \
            -c 'import importlib, os, pathlib; assert os.getuid() != 0, "image runs as root"; names = sorted(p.stem for p in pathlib.Path("/app").glob("*.py")); [importlib.import_module(n) for n in names]; print("imported", len(names), "shipped modules as uid", os.getuid())'

      - name: Scope of this job
        if: always()
        run: |
          echo "### production-image" >> "$GITHUB_STEP_SUMMARY"
          echo "Built bot/Dockerfile from this commit and imported the application inside that image: offline, read-only, unprivileged. The application was not started and the image was not published. This proves the shipped modules import; it says nothing about venue behaviour or profitability." >> "$GITHUB_STEP_SUMMARY"

  shadow-runtime-image:
    name: forward-shadow runtime runs inside the production image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: ai-agent-control-shadow-smoke:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the production image (bot/Dockerfile, context ./bot)
        run: docker build --pull --tag "$IMAGE" ./bot

      - name: Run carry_shadow.py in the image (offline, read-only, no entrypoint)
        run: |
          # The shipped CLI, in the shipped image: the real CarryEngine against
          # its simulated venue, into a throwaway database. One container, so
          # the database persists between the three calls: a synthetic fixture
          # observation (origin synthetic_fixture, judged against its own
          # clock), the SAME observation again (must be a duplicate no-op),
          # then the report. No network, no credential, no order path.
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,size=16m \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --pids-limit 64 \
            -e USE_TESTNET=1 \
            -e PAPER_TRADING=1 \
            -e LIVE_TRADING_ACK= \
            --entrypoint sh \
            "$IMAGE" -ec '
              OBS="{\"perp_mark\":80000,\"spot_mark\":79990,\"funding_bps\":3,\"funding_print_bps\":3,\"funding_print_ms\":1700000000000,\"observed_at_s\":1700000000,\"source\":\"ci fixture\"}"
              FLAGS="--db /tmp/shadow.db --origin synthetic_fixture --venue historical --borrow-apr 0.0 --execution-mode overlay --inventory-btc 0.01 --margin-multiple 5"
              echo "$OBS" | python3 carry_shadow.py step $FLAGS --observation - | tee /tmp/first.json
              grep -q STEP_RECORDED /tmp/first.json
              echo "$OBS" | python3 carry_shadow.py step $FLAGS --observation - | tee /tmp/second.json
              grep -q DUPLICATE_OBSERVATION /tmp/second.json
              python3 carry_shadow.py report $FLAGS | tee /tmp/report.json
              grep -q "MODELLED NET ECONOMICS" /tmp/report.json
            '

      - name: Scope of this job
        if: always()
        run: |
          echo "### shadow-runtime-image" >> "$GITHUB_STEP_SUMMARY"
          echo "Ran the shipped carry_shadow.py CLI inside the image built from this commit: a synthetic fixture observation, then the same observation again (duplicate no-op). Modelled economics only; no network, no credential, no order path." >> "$GITHUB_STEP_SUMMARY"
