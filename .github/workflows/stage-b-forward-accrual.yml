name: stage-b-forward-accrual

# NO AUTOMATIC SCHEDULE. docs/human/NO_GLUE_OPS.md item 10 names the Factory
# Mac cron as the one canonical scheduled corpus writer. A `schedule:`
# trigger here used to run this same accrual (and commit+push its result to
# main) on an independent daily cron, ~1 hour before the Factory Mac's own
# — two unsupervised, uncoordinated writers racing to append the same
# dual-tree corpus and push to main, with no lease or ownership check
# between them. It never actually collided (this workflow found nothing to
# commit in its whole run history), but "never collided yet" is not the
# same as "cannot collide" on a live daily schedule.
#
# This workflow is manual-dispatch-only now: a human (or an explicitly
# human-triggered failover procedure) runs it on purpose, exactly like the
# Factory Mac path, never on its own clock. If GitHub-hosted runners keep
# getting Binance HTTP 451 geo-blocks and a second *scheduled* writer is
# genuinely needed, that requires a real ownership mechanism between it and
# the Factory Mac (see NO_GLUE_OPS.md item 10) before a `schedule:` trigger
# comes back here — not a second independent cron.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage-b-forward-accrual
  cancel-in-progress: false

jobs:
  accrue:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -r bot/requirements.txt

      - name: Accrue (corpora + scratch only — never promote)
        working-directory: bot
        run: bash scripts/stage_b_forward_accrual.sh

      - name: Commit corpus tip if dirty
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            bot/data/real_funding \
            bot/data/real_funding_full \
            bot/data/real_linear_1d \
            bot/data/real_linear_1d_full \
            bot/data/real_spot_btc \
            bot/data/real_spot_full \
            bot/artifacts/data_read_ledger.json 2>/dev/null || true
          # Never commit scratch state or shadow/gate — human promote only
          if git diff --cached --quiet; then
            echo "No corpus tip changes."
          else
            git commit -m "ci: Stage B corpus tip accrual (no promote)"
            git push origin HEAD:main
          fi
